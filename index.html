<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunum Planı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // ============================================================
  //  BURAYI DÜZENLE — sadece bu bloğu değiştirmen yeterli
  // ============================================================
  const ODEV = {
    isim: "Rabia",                       // Ona hitap edilecek isim
    ders: "Ders adı",                    // Örn: "Sosyoloji"
    konu: "Sunumun konusu buraya",       // Ana konu
    teslimTarihi: "",                    // Örn: "2026-11-15" (boş bırakılabilir)
    not: "Sen yaparsın, ben hep yanındayım. ❤️",
    basliklar: [
      { baslik: "Giriş", aciklama: "Konuyu tanıt, neden önemli olduğunu anlat." },
      { baslik: "Tarihçe / Arka Plan", aciklama: "Konunun ortaya çıkışı ve gelişimi." },
      { baslik: "Temel Kavramlar", aciklama: "Bilinmesi gereken ana terimler." },
      { baslik: "Örnekler", aciklama: "Güncel ya da çarpıcı örnekler ver." },
      { baslik: "Sonuç", aciklama: "Kısa bir özet ve kendi yorumun." },
      { baslik: "Kaynakça", aciklama: "Kullandığın kaynakları listele." }
    ]
  };
  // ============================================================
</script>
<style>
  :root {
    --bg: #fdf6f4;
    --card: #ffffff;
    --ink: #2b1d22;
    --muted: #7a6469;
    --accent: #d6456b;
    --accent-soft: #fbe3ea;
    --line: #f0dde2;
    --done: #3a9a6b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1417; --card: #261b1f; --ink: #f6eaed; --muted: #b59aa2;
      --accent: #ff7096; --accent-soft: #3d2128; --line: #3a2a2f; --done: #5fcb93;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1417; --card: #261b1f; --ink: #f6eaed; --muted: #b59aa2;
    --accent: #ff7096; --accent-soft: #3d2128; --line: #3a2a2f; --done: #5fcb93;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, sans-serif; line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  .hello { color: var(--accent); font-weight: 600; margin: 0 0 4px; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(28px, 7vw, 40px); line-height: 1.15; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .pill { background: var(--accent-soft); color: var(--accent); padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .progress { margin: 28px 0 12px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 32px 0 12px; }
  ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li label {
    display: flex; gap: 14px; align-items: flex-start; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    transition: border-color .2s;
  }
  li label:hover { border-color: var(--accent); }
  .num {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 600; font-size: 14px;
    background: var(--accent-soft); color: var(--accent);
  }
  input[type=checkbox] { position: absolute; opacity: 0; pointer-events: none; }
  input:checked + label .num { background: var(--done); color: #fff; }
  input:checked + label .title { text-decoration: line-through; color: var(--muted); }
  input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .title { font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .note {
    margin-top: 32px; padding: 18px 20px; border-radius: 14px;
    background: var(--accent-soft); font-family: Fraunces, Georgia, serif; font-size: 18px;
  }
  .celebrate { display: none; text-align: center; margin-top: 16px; font-weight: 600; color: var(--done); }
  .celebrate.show { display: block; }
</style>
</head>
<body>
<main>
  <p class="hello" id="hello"></p>
  <h1 id="konu"></h1>
  <div class="meta" id="meta"></div>

  <div class="progress">
    <div class="progress-top"><span>İlerleme</span><span id="count"></span></div>
    <div class="bar"><span id="fill"></span></div>
  </div>

  <h2>Hazırlaman gereken başlıklar</h2>
  <ol id="list"></ol>
  <p class="celebrate" id="celebrate">Hepsi tamam! Harikasın 🎉</p>

  <div class="note" id="note"></div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const KEY = "odev-ilerleme:" + ODEV.konu;
  let done = [];
  try { done = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

  document.title = ODEV.konu + " · Sunum Planı";
  $("hello").textContent = "Merhaba " + ODEV.isim + " 💕";
  $("konu").textContent = ODEV.konu;
  $("note").textContent = ODEV.not;

  const meta = [];
  if (ODEV.ders) meta.push('<span class="pill"></span>');
  $("meta").innerHTML = meta.join("");
  if (ODEV.ders) $("meta").querySelector(".pill").textContent = ODEV.ders;
  if (ODEV.teslimTarihi) {
    const due = new Date(ODEV.teslimTarihi + "T23:59:00");
    const days = Math.ceil((due - new Date()) / 86400000);
    const s = document.createElement("span");
    s.textContent = "Teslim: " + due.toLocaleDateString("tr-TR", { day: "numeric", month: "long" }) +
      (days > 0 ? ` · ${days} gün kaldı` : days === 0 ? " · bugün!" : " · süre doldu");
    $("meta").appendChild(s);
  }

  ODEV.basliklar.forEach((b, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<input type="checkbox" id="b${i}"><label for="b${i}">
      <span class="num">${i + 1}</span><span><div class="title"></div><div class="desc"></div></span></label>`;
    li.querySelector(".title").textContent = b.baslik;
    li.querySelector(".desc").textContent = b.aciklama || "";
    const cb = li.querySelector("input");
    cb.checked = done.includes(i);
    cb.addEventListener("change", () => {
      done = cb.checked ? [...done, i] : done.filter(x => x !== i);
      try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {}
      update();
    });
    $("list").appendChild(li);
  });

  function update() {
    const total = ODEV.basliklar.length, n = done.length;
    $("count").textContent = `${n} / ${total}`;
    $("fill").style.width = (total ? n / total * 100 : 0) + "%";
    $("celebrate").classList.toggle("show", total > 0 && n === total);
  }
  update();
</script>
</body>
</html>
